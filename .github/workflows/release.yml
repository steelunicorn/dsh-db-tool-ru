name: Release

# 本 fork 只通过 GitHub 分发（不发布到 npm）：推送 v* 标签即构建产物并挂到 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack
        run: npm pack

      - name: Collect artifact name
        id: pkg
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tarball=$(node -p "require('./package.json').name")-$V.tgz" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: dsh-db-tool-ru ${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.tarball }}
          body: |
            Установка из исходников этого тега:

            ```bash
            dsh plugin --profile desktop add "github:steelunicorn/dsh-db-tool-ru#${{ github.ref_name }}"
            ```

            Или из приложенного архива `${{ steps.pkg.outputs.tarball }}`:

            ```bash
            dsh plugin --profile desktop add "file:$PWD/${{ steps.pkg.outputs.tarball }}"
            ```

            Перед включением отключите оригинальный `dsh-db-tool`: у форка то же имя
            инструмента (`DatabaseManager`) и тот же каталог данных.
